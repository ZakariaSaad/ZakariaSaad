name: Cinque V3 compatibility and recovery
on:
  pull_request:
    paths:
      - 'openpilot/sunnypilot/modeld_v2/**'
      - 'openpilot/common/params_keys.h'
      - 'openpilot/sunnypilot/models/helpers.py'
      - 'tools/cinque_v3.py'
      - 'tools/mvl_startup_check.py'
      - 'openpilot/system/manager/process_config.py'
      - '.github/workflows/cinque_v3.yaml'
  push:
    branches: [mvl-cinque-v3]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stateful_and_fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DEV: CPU
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: astral-sh/setup-uv@v7
      - name: Preserve MVL controls, safety, launcher, updater, and dependency baseline
        run: |
          git fetch --no-tags --depth=1 origin 73dca34cece29339f43835f1c9296a5809586f4b
          git diff --exit-code 73dca34cece29339f43835f1c9296a5809586f4b HEAD -- \
            opendbc_repo panda .gitmodules pyproject.toml uv.lock \
            launch_chffrplus.sh launch_env.sh openpilot/common/hardware \
            openpilot/system/updated openpilot/system/manager/manager.py \
            openpilot/selfdrive/controls openpilot/selfdrive/selfdrived \
            openpilot/sunnypilot/selfdrive/controls
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang capnproto libcapnp-dev
      - run: uv sync --frozen --all-extras
      - name: Lint compatibility and startup code
        run: >-
          .venv/bin/ruff check openpilot/sunnypilot/modeld_v2
          openpilot/sunnypilot/models/helpers.py openpilot/system/manager/process_config.py
          tools/cinque_v3.py tools/mvl_startup_check.py
      - name: Build native test prerequisites
        run: |
          source .venv/bin/activate
          scons --minimal -j4 \
            openpilot/common/libparams_c.so \
            msgq_repo/msgq/ipc_pyx.so \
            msgq_repo/msgq/visionipc/visionipc_pyx.so
      - name: Stateful startup, selection, fault persistence, and upgrade tests
        run: >-
          .venv/bin/python -m unittest
          openpilot.sunnypilot.modeld_v2.tests.test_cinque_guard
          openpilot.sunnypilot.modeld_v2.tests.test_stateful
          openpilot.sunnypilot.modeld_v2.tests.test_cinque_adapter
          openpilot.sunnypilot.modeld_v2.tests.test_compile_cinque
          openpilot.sunnypilot.modeld_v2.tests.test_startup
          openpilot.sunnypilot.modeld_v2.tests.test_boot_smoke
          openpilot.sunnypilot.modeld_v2.tests.test_modeld_loop
          openpilot.sunnypilot.modeld_v2.tests.test_update_switch
          opendbc.car.honda.tests.test_honda
          opendbc.car.honda.tests.test_lane_path
          opendbc.car.honda.tests.test_nidec_speed_lead -v
      - name: Legacy model compiler and parser regressions
        run: >-
          .venv/bin/python tools/test_runner.py -j4
          openpilot/sunnypilot/modeld_v2/tests/test_parse_model_outputs.py
          openpilot/sunnypilot/modeld_v2/tests/test_compile_modeld.py
